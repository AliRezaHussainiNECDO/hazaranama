<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="هزاره‌نامه — مرجع دیجیتال تاریخ، فرهنگ و حافظه‌ی جمعی مردم هزاره">
  <meta name="theme-color" content="#05070F">
  <meta property="og:title" content="هزاره‌نامه">
  <meta property="og:description" content="مرجع دیجیتال تاریخ، فرهنگ و حافظه‌ی جمعی مردم هزاره">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:type" content="website">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="هزاره‌نامه">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>هزاره‌نامه</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #05070F; }
    #hz-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 40%, #0D1226 0%, #05070F 70%);
      transition: opacity .35s ease;
    }
    #hz-splash img { width: 132px; height: 132px; border-radius: 50%;
      box-shadow: 0 0 40px rgba(91,147,255,.25); animation: hz-pulse 1.8s ease-in-out infinite; }
    #hz-splash .bar { width: 120px; height: 3px; border-radius: 2px; overflow: hidden;
      background: rgba(255,255,255,.08); }
    #hz-splash .bar::after { content: ""; display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg, #5B93FF, #FFC94D); animation: hz-slide 1.2s ease-in-out infinite; }
    @keyframes hz-pulse { 50% { transform: scale(1.04); } }
    @keyframes hz-slide { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
  </style>
</head>
<body>
  <div id="hz-splash" aria-label="در حال بارگذاری هزاره‌نامه">
    <img src="icons/Icon-192.png" alt="هزاره‌نامه">
    <div class="bar"></div>
  </div>
  <script>
    // وقتی Flutter اولین فریم را کشید، اسپلش را محو کن.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('hz-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
