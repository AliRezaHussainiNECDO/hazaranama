# API هزاره‌نامه — Cloudflare Worker (جایگزین Supabase)
name = "hazaranama-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
ADMIN_EMAIL = "alireza.necdo@gmail.com"
AI_MODEL = "@cf/google/gemma-3-12b-it"
# فرستنده‌ی ایمیل‌ها (دامنه باید در Resend تأیید شده باشد). تا خالی است، ایمیل خاموش است
# و بازیابی رمز از راه مدیر انجام می‌شود. نمونه: "هزاره‌نامه <no-reply@hazaranama.com>"
EMAIL_FROM = "هزاره‌نامه <no-reply@hazaranama.com>"

[[d1_databases]]
binding = "DB"
database_name = "hazaranama_db"
database_id = "bd394188-07f4-4673-99ed-e51ce12bc576"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hazaranama-media"

[ai]
binding = "AI"

# هر دقیقه: پردازش داده‌های منتقل‌شده از Supabase و انتقال فایل‌ها به R2
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# schema.sql به‌صورت متن داخل Worker بسته‌بندی می‌شود
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# سکرت‌ها (از داشبورد: Settings → Variables and Secrets):
#   JWT_SECRET           رشته‌ی تصادفی بلند برای امضای نشست‌ها
#   MIGRATION_KEY        کلید یک‌بارمصرف انتقال داده از Supabase
#   FCM_SERVICE_ACCOUNT  (اختیاری) JSON حساب سرویس Firebase برای پوش
#   RESEND_API_KEY       (اختیاری) کلید Resend برای ایمیل (بازیابی رمز، خوش‌آمد، تغییر رمز)
#   FACEBOOK_APP_ID, FACEBOOK_APP_SECRET   (اختیاری) ورود با فیسبوک — هر دو را Secret بگذارید
#   X_CLIENT_ID, X_CLIENT_SECRET           (اختیاری) ورود با ایکس/توییتر — هر دو را Secret بگذارید
